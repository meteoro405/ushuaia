</head>
<body>
  <div class="app">

    <header class="header">
      <div class="header-inner">
        <div class="compass-wrap">

  <defs>

      <stop offset="0" stop-color="#E6F3FD"/><stop offset="1" stop-color="#9CC8EA"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="57" fill="url(#pg-bg)" stroke="#FFFFFF" stroke-width="3"/>
  <!-- sombra en el hielo -->
  <ellipse cx="60" cy="103" rx="30" ry="5" fill="#0F3558" opacity="0.18"/>
  <!-- aletas -->
  <path d="M37 62 C24 68 20 88 27 98 C36 92 41 80 41 66 Z" fill="#12263A"/>
  <path d="M83 62 C96 68 100 88 93 98 C84 92 79 80 79 66 Z" fill="#12263A"/>
  <!-- cuerpo -->
  <path d="M60 14 C41 14 33 31 33 51 C33 77 38 99 60 99 C82 99 87 77 87 51 C87 31 79 14 60 14 Z" fill="#12263A"/>
  <!-- panza -->
  <path d="M60 52 C48 52 43 65 43 78 C43 91 49 97 60 97 C71 97 77 91 77 78 C77 65 72 52 60 52 Z" fill="#FFFFFF"/>
  <!-- parches blancos de la cara -->
  <circle cx="51" cy="38" r="10" fill="#FFFFFF"/>
  <circle cx="69" cy="38" r="10" fill="#FFFFFF"/>
  <!-- ojos -->
  <circle cx="52" cy="39" r="4.2" fill="#12263A"/>
  <circle cx="68" cy="39" r="4.2" fill="#12263A"/>
  <circle cx="53.4" cy="37.6" r="1.4" fill="#FFFFFF"/>
  <circle cx="69.4" cy="37.6" r="1.4" fill="#FFFFFF"/>
  <!-- pico -->
  <path d="M53 46 Q60 41 67 46 Q60 57 53 46 Z" fill="#F5A623"/>
  <!-- bufanda -->
  <path d="M39 57 Q60 69 81 57 L81 65 Q60 77 39 65 Z" fill="#3F8FD0"/>
  <path d="M49 63 Q60 68 71 63 L71 66 Q60 71 49 66 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M72 66 L81 63 L84 80 L75 82 Z" fill="#3F8FD0"/>
  <!-- patas -->
  <ellipse cx="50" cy="99" rx="10" ry="4.5" fill="#F5A623"/>
  <ellipse cx="70" cy="99" rx="10" ry="4.5" fill="#F5A623"/>
</svg>
        </div>
        <div class="logo-area">
          <div class="app-title">Ushuaia cuenta su historia</div>
          <div class="app-sub">Una ciudad, muchas historias. Descubrila.</div>
        </div>
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input type="search" id="searchInput" class="search-input"
            placeholder="Buscá una estación o un lugar"
            autocomplete="off" spellcheck="false"/>
          <button class="search-clear" id="searchClear" title="Limpiar">✕</button>
          <button class="install-btn" id="installBtn" title="Instalar app" style="display:none">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v13M6 11l6 6 6-6"/><path d="M3 19h18"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="toolbar" id="toolbarWrap">
      <button class="pill map-view-pill" id="btnMapaView" onclick="toggleMapaView()">🗺 Mapa</button>
      <div class="toolbar-sep"></div>
      <button class="pill filter-special fav-pill" id="btnFavs" onclick="filterSpecial('FAVORITOS',this)">♥ Favs</button>
      <button class="pill filter-special done-pill" id="btnVisit" onclick="filterSpecial('VISITADOS',this)">✓ Visitados</button>
      <div class="toolbar-sep"></div>
      <button class="pill random-pill" onclick="showRandom()">🎲 Al azar</button>
    </div>

    <div class="main">
      <aside class="sidebar">
        <div class="sidebar-count" id="sideCount">— sitios</div>
        <div id="sideList"></div>
      </aside>
      <section class="detail" id="detail">
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="44" height="44" opacity="0.35" aria-hidden="true">
  <defs>
    <linearGradient id="pg-bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6F3FD"/><stop offset="1" stop-color="#9CC8EA"/>
    </linearGradient>
  </defs>
  <!-- fondo circular celeste -->
  <circle cx="60" cy="60" r="57" fill="url(#pg-bg2)" stroke="#FFFFFF" stroke-width="3"/>
  <!-- sombra en el hielo -->
  <ellipse cx="60" cy="103" rx="30" ry="5" fill="#0F3558" opacity="0.18"/>
  <!-- aletas -->
  <path d="M37 62 C24 68 20 88 27 98 C36 92 41 80 41 66 Z" fill="#12263A"/>
  <path d="M83 62 C96 68 100 88 93 98 C84 92 79 80 79 66 Z" fill="#12263A"/>
  <!-- cuerpo -->
  <path d="M60 14 C41 14 33 31 33 51 C33 77 38 99 60 99 C82 99 87 77 87 51 C87 31 79 14 60 14 Z" fill="#12263A"/>
  <!-- panza -->
  <path d="M60 52 C48 52 43 65 43 78 C43 91 49 97 60 97 C71 97 77 91 77 78 C77 65 72 52 60 52 Z" fill="#FFFFFF"/>
  <!-- parches blancos de la cara -->
  <circle cx="51" cy="38" r="10" fill="#FFFFFF"/>
  <circle cx="69" cy="38" r="10" fill="#FFFFFF"/>
  <!-- ojos -->
  <circle cx="52" cy="39" r="4.2" fill="#12263A"/>
  <circle cx="68" cy="39" r="4.2" fill="#12263A"/>
  <circle cx="53.4" cy="37.6" r="1.4" fill="#FFFFFF"/>
  <circle cx="69.4" cy="37.6" r="1.4" fill="#FFFFFF"/>
  <!-- pico -->
  <path d="M53 46 Q60 41 67 46 Q60 57 53 46 Z" fill="#F5A623"/>
  <!-- bufanda -->
  <path d="M39 57 Q60 69 81 57 L81 65 Q60 77 39 65 Z" fill="#3F8FD0"/>
  <path d="M49 63 Q60 68 71 63 L71 66 Q60 71 49 66 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M72 66 L81 63 L84 80 L75 82 Z" fill="#3F8FD0"/>
  <!-- patas -->
  <ellipse cx="50" cy="99" rx="10" ry="4.5" fill="#F5A623"/>
  <ellipse cx="70" cy="99" rx="10" ry="4.5" fill="#F5A623"/>
</svg>
          <div class="empty-txt">Seleccioná un sitio</div>
        </div>
      </section>
    </div>
  </div>

  <!-- Panel mapa de la ciudad -->
  <div class="mapa-ign-panel" id="mapaIgnPanel" style="display:none;">
    <div id="mapaIgn" style="width:100%;height:100%;"></div>
  </div>

  <!-- Modal Google Maps -->
  <div class="maps-modal" id="mapsModal" onclick="closeMaps(event)">
    <div class="maps-modal-inner">
      <div class="maps-modal-header">
        <span id="mapsTitle">Google Maps</span>
        <button class="maps-close" onclick="closeMapsBtn()">✕</button>
      </div>
      <iframe id="mapsFrame" class="maps-frame" src="" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lb-overlay">
    <img id="lb-img" src="" alt="" draggable="false"/>
    <button id="lb-close" aria-label="Cerrar">✕</button>
    <div id="lb-badge"></div>
    <div id="lb-hint">Pellizco para zoom · Arrastrá para mover · Doble tap para zoom</div>
  </div>

  <!-- Banner instalación PWA (Android/Chrome) -->
  <div class="install-banner" id="installBanner" style="display:none">
    <span class="install-banner-txt">📲 Instalá la app para usarla sin internet</span>
    <div class="install-banner-btns">
      <button class="install-banner-ok" id="installBannerOk">Instalar</button>
      <button class="install-banner-no" id="installBannerNo">Ahora no</button>
    </div>
  </div>

  <!-- Banner Safari / iOS -->
  <div class="install-banner install-banner-ios" id="installBannerIos" style="display:none">
    <button class="install-banner-close" id="installBannerIosClose">✕</button>
    <span class="install-banner-txt">Para instalar: tocá <strong>Compartir</strong> <span style="font-size:17px">⎙</span> y después <strong>«Agregar a pantalla de inicio»</strong></span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // ── PWA Install ──────────────────────────────────────────
    window._installPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window._installPrompt = e;
      if (!sessionStorage.getItem('installDismissed')) {
        const b = document.getElementById('installBanner');
        if (b) b.style.display = 'flex';
      }
      const btn = document.getElementById('installBtn');
      if (btn) btn.style.display = 'flex';
    });

    window.addEventListener('appinstalled', () => {
      window._installPrompt = null;
      const b = document.getElementById('installBanner');
      if (b) b.style.display = 'none';
      const btn = document.getElementById('installBtn');
      if (btn) btn.style.display = 'none';
    });

    async function pedirInstalacion() {
      if (!window._installPrompt) return;
      window._installPrompt.prompt();
      const { outcome } = await window._installPrompt.userChoice;
      window._installPrompt = null;
      if (outcome === 'accepted') {
        const btn = document.getElementById('installBtn');
        if (btn) btn.style.display = 'none';
      }
    }
    document.getElementById('installBtn').addEventListener('click', pedirInstalacion);
    document.getElementById('installBannerOk').addEventListener('click', () => {
      document.getElementById('installBanner').style.display = 'none';
      pedirInstalacion();
    });
    document.getElementById('installBannerNo').addEventListener('click', () => {
      document.getElementById('installBanner').style.display = 'none';
      sessionStorage.setItem('installDismissed', '1');
    });
    document.getElementById('installBannerIosClose').addEventListener('click', () => {
      document.getElementById('installBannerIos').style.display = 'none';
      sessionStorage.setItem('installDismissed', '1');
    });
    (function detectIos() {
      const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      if (isIos && isSafari && !isStandalone && !sessionStorage.getItem('installDismissed')) {
        document.getElementById('installBannerIos').style.display = 'flex';
      }
    })();
  </script>
</body>
</html>
