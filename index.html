<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta name="theme-color" content="#7A3A18" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ushuaia" />
  <link rel="apple-touch-icon" href="pwa_icon_192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta name="description" content="Guía de sitios de interés de Ushuaia, la ciudad del fin del mundo: horarios, ubicación, clima y qué ver en cada lugar." />
  <title>Sitios de interés en Ushuaia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="header-inner">
        <div class="compass-wrap">
          <svg class="compass-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="dg" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#C8845A"/><stop offset="40%" stop-color="#A0552A"/><stop offset="100%" stop-color="#5C2A0E"/></radialGradient>
              <radialGradient id="cg" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#D4956A"/><stop offset="100%" stop-color="#7A3A18"/></radialGradient>
              <filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#2A1005" flood-opacity="0.6"/></filter>
            </defs>
            <circle cx="60" cy="60" r="57" fill="url(#dg)" filter="url(#sh)"/>
            <circle cx="60" cy="60" r="54" fill="none" stroke="#7A3A18" stroke-width="1.5" opacity="0.6"/>
            <g stroke="#9A5530" stroke-width="0.8" opacity="0.7"><line x1="60" y1="8" x2="60" y2="14"/><line x1="60" y1="106" x2="60" y2="112"/><line x1="8" y1="60" x2="14" y2="60"/><line x1="106" y1="60" x2="112" y2="60"/></g>
            <polygon points="60,6 64,52 60,58 56,52" fill="#1A0A02"/>
            <polygon points="60,114 64,68 60,62 56,68" fill="#1A0A02"/>
            <polygon points="6,60 52,56 58,60 52,64" fill="#1A0A02"/>
            <polygon points="114,60 68,56 62,60 68,64" fill="#1A0A02"/>
            <polygon points="18,18 52,54 58,60 50,52" fill="#C07040"/>
            <polygon points="102,18 68,54 62,60 70,52" fill="#C07040"/>
            <polygon points="18,102 52,66 58,60 50,68" fill="#C07040"/>
            <polygon points="102,102 68,66 62,60 70,68" fill="#C07040"/>
            <circle cx="60" cy="60" r="18" fill="#6A3018" stroke="#C8845A" stroke-width="1"/>
            <circle cx="60" cy="60" r="14" fill="url(#cg)" stroke="#9A5530" stroke-width="0.8"/>
            <circle cx="60" cy="60" r="5" fill="#D4956A" stroke="#5C2A0E" stroke-width="1"/>
            <circle cx="60" cy="60" r="2.5" fill="#1A0A02"/>
            <text x="60" y="28" text-anchor="middle" font-family="serif" font-size="8" font-weight="bold" fill="#E8C090">N</text>
            <polygon points="60,10 62,22 60,20 58,22" fill="#E8D0A0" opacity="0.9"/>
          </svg>
        </div>
        <div class="logo-area">
          <div class="app-title">Sitios de interés en Ushuaia</div>
          <div class="app-sub">La ciudad del fin del mundo</div>
        </div>
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input type="search" id="searchInput" class="search-input"
            placeholder="Buscá un sitio o lugar"
            autocomplete="off" spellcheck="false"/>
          <button class="search-clear" id="searchClear" title="Limpiar">✕</button>
          <button class="install-btn" id="installBtn" title="Instalar app" style="display:none">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v13M6 11l6 6 6-6"/><path d="M3 19h18"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="toolbar" id="toolbarWrap">
      <button class="pill map-view-pill" id="btnMapaView" onclick="toggleMapaView()">🗺 Mapa</button>
      <div class="toolbar-sep"></div>
      <button class="pill filter-special fav-pill" id="btnFavs" onclick="filterSpecial('FAVORITOS',this)">♥ Favs</button>
      <button class="pill filter-special done-pill" id="btnVisit" onclick="filterSpecial('VISITADOS',this)">✓ Visitados</button>
      <div class="toolbar-sep"></div>
      <button class="pill random-pill" onclick="showRandom()">🎲 Al azar</button>
    </div>

    <div class="main">
      <aside class="sidebar">
        <div class="sidebar-count" id="sideCount">— sitios</div>
        <div id="sideList"></div>
      </aside>
      <section class="detail" id="detail">
        <div class="empty-state">
          <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" width="36" height="36" opacity="0.2">
            <circle cx="60" cy="60" r="57" fill="#A0552A"/>
            <polygon points="60,6 64,52 60,58 56,52" fill="#1A0A02"/>
            <polygon points="60,114 64,68 60,62 56,68" fill="#1A0A02"/>
            <polygon points="6,60 52,56 58,60 52,64" fill="#1A0A02"/>
            <polygon points="114,60 68,56 62,60 68,64" fill="#1A0A02"/>
            <polygon points="18,18 52,54 58,60 50,52" fill="#C07040"/>
            <polygon points="102,18 68,54 62,60 70,52" fill="#C07040"/>
            <polygon points="18,102 52,66 58,60 50,68" fill="#C07040"/>
            <polygon points="102,102 68,66 62,60 70,68" fill="#C07040"/>
            <circle cx="60" cy="60" r="14" fill="#7A3A18"/>
            <circle cx="60" cy="60" r="5" fill="#D4956A"/>
          </svg>
          <div class="empty-txt">Seleccioná un sitio</div>
        </div>
      </section>
    </div>
  </div>

  <!-- Panel mapa de la ciudad -->
  <div class="mapa-ign-panel" id="mapaIgnPanel" style="display:none;">
    <div id="mapaIgn" style="width:100%;height:100%;"></div>
  </div>

  <!-- Modal Google Maps -->
  <div class="maps-modal" id="mapsModal" onclick="closeMaps(event)">
    <div class="maps-modal-inner">
      <div class="maps-modal-header">
        <span id="mapsTitle">Google Maps</span>
        <button class="maps-close" onclick="closeMapsBtn()">✕</button>
      </div>
      <iframe id="mapsFrame" class="maps-frame" src="" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lb-overlay">
    <img id="lb-img" src="" alt="" draggable="false"/>
    <button id="lb-close" aria-label="Cerrar">✕</button>
    <div id="lb-badge"></div>
    <div id="lb-hint">Pellizco para zoom · Arrastrá para mover · Doble tap para zoom</div>
  </div>

  <!-- Banner instalación PWA (Android/Chrome) -->
  <div class="install-banner" id="installBanner" style="display:none">
    <span class="install-banner-txt">📲 Instalá la app para usarla sin internet</span>
    <div class="install-banner-btns">
      <button class="install-banner-ok" id="installBannerOk">Instalar</button>
      <button class="install-banner-no" id="installBannerNo">Ahora no</button>
    </div>
  </div>

  <!-- Banner Safari / iOS -->
  <div class="install-banner install-banner-ios" id="installBannerIos" style="display:none">
    <button class="install-banner-close" id="installBannerIosClose">✕</button>
    <span class="install-banner-txt">Para instalar: tocá <strong>Compartir</strong> <span style="font-size:17px">⎙</span> y después <strong>«Agregar a pantalla de inicio»</strong></span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // ── PWA Install ──────────────────────────────────────────
    window._installPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window._installPrompt = e;
      if (!sessionStorage.getItem('installDismissed')) {
        const b = document.getElementById('installBanner');
        if (b) b.style.display = 'flex';
      }
      const btn = document.getElementById('installBtn');
      if (btn) btn.style.display = 'flex';
    });

    window.addEventListener('appinstalled', () => {
      window._installPrompt = null;
      const b = document.getElementById('installBanner');
      if (b) b.style.display = 'none';
      const btn = document.getElementById('installBtn');
      if (btn) btn.style.display = 'none';
    });

    async function pedirInstalacion() {
      if (!window._installPrompt) return;
      window._installPrompt.prompt();
      const { outcome } = await window._installPrompt.userChoice;
      window._installPrompt = null;
      if (outcome === 'accepted') {
        const btn = document.getElementById('installBtn');
        if (btn) btn.style.display = 'none';
      }
    }
    document.getElementById('installBtn').addEventListener('click', pedirInstalacion);
    document.getElementById('installBannerOk').addEventListener('click', () => {
      document.getElementById('installBanner').style.display = 'none';
      pedirInstalacion();
    });
    document.getElementById('installBannerNo').addEventListener('click', () => {
      document.getElementById('installBanner').style.display = 'none';
      sessionStorage.setItem('installDismissed', '1');
    });
    document.getElementById('installBannerIosClose').addEventListener('click', () => {
      document.getElementById('installBannerIos').style.display = 'none';
      sessionStorage.setItem('installDismissed', '1');
    });
    (function detectIos() {
      const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      if (isIos && isSafari && !isStandalone && !sessionStorage.getItem('installDismissed')) {
        document.getElementById('installBannerIos').style.display = 'flex';
      }
    })();
  </script>
</body>
</html>
